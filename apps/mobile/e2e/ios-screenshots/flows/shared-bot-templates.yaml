appId: com.rakazo.app
name: Shared bot templates
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///shared-bot-templates"
- extendedWaitUntil:
    visible: "No templates yet"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-shared-bot-templates-empty
